name: Publish Python package

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release version and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          root = tomllib.loads(Path("Cargo.toml").read_text())
          adapter = tomllib.loads(Path("python/native/Cargo.toml").read_text())
          toolchain = tomllib.loads(Path("toolchain/pyproject.toml").read_text())
          python_project = tomllib.loads(Path("pyproject.toml").read_text())
          root_version = root["package"]["version"]
          adapter_version = adapter["package"]["version"]
          toolchain_version = toolchain["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected_extra = [f"shellsim-c-toolchain=={tag_version}"]
          actual_extra = python_project["project"]["optional-dependencies"]["c"]
          if (
              root_version != adapter_version
              or root_version != toolchain_version
              or root_version != tag_version
              or actual_extra != expected_extra
          ):
              raise SystemExit(
                  f"version mismatch: root={root_version}, adapter={adapter_version}, "
                  f"toolchain={toolchain_version}, tag={tag_version}, extra={actual_extra}"
              )
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  wheels:
    needs: [plan, toolchain]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: manylinux_2_28
          - os: ubuntu-latest
            target: aarch64
            manylinux: manylinux_2_28
          - os: macos-15-intel
            target: x86_64
          - os: macos-14
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: "1.97.1"
          args: --release --locked --out dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.os != 'ubuntu-latest' || matrix.target == 'x86_64'
        with:
          name: toolchain
          path: toolchain-dist
      - name: Smoke-test native wheel
        if: matrix.os != 'ubuntu-latest' || matrix.target == 'x86_64'
        shell: bash
        run: |
          python -m pip install pytest dist/*.whl toolchain-dist/*.whl
          python -m pytest tests/python_package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          rust-toolchain: "1.97.1"
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  toolchain:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1,<2"
      - run: python -m build toolchain --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolchain
          path: dist/*
          if-no-files-found: error

  verify:
    needs: [wheels, sdist, toolchain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Check and test built artifacts
        run: |
          python -m pip install --upgrade pip pytest twine
          python -m twine check --strict dist/*
          python -m pip install dist/shellsim-*manylinux*x86_64.whl
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path
          import shellsim

          assert importlib.util.find_spec("shellsim_c_toolchain") is None
          assert shellsim.run("printf core").stdout == b"core"
          with tempfile.TemporaryDirectory() as directory:
              Path(directory, "run.sh").write_text("true\n")
              package = shellsim.Package.build_from_directory(
                  directory,
                  spec=shellsim.PackageSpec(name="requires-c", version="1", entrypoint=("sh", "/work/run.sh"), requires_c_toolchain=True),
              )
              try:
                  package.instantiate(tools={})
              except RuntimeError as error:
                  assert "shellsim[c]" in str(error)
              else:
                  raise AssertionError("missing toolchain was accepted")
          PY
          python -m pip install dist/shellsim_c_toolchain-*.whl
          python -m pytest tests/python_package
      - name: Rebuild and smoke-test from the isolated sdist
        run: |
          mkdir "$RUNNER_TEMP/from-sdist"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" dist/shellsim-*.tar.gz dist/shellsim_c_toolchain-*.tar.gz
          python -m pip install --force-reinstall "$RUNNER_TEMP"/from-sdist/*.whl
          python - <<'PY'
          import shellsim
          import shellsim_c_toolchain

          result = shellsim.run("printf sdist")
          assert result.returncode == 0
          assert result.stdout == b"sdist"
          guest = shellsim.Container(tools={})
          shellsim_c_toolchain.install_c_toolchain(guest)
          assert guest.read_file("/tcc/tcc-shellsim.wasm").startswith(b"\0asm")
          PY

  pypi-toolchain:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shellsim-c-toolchain
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: toolchain
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  pypi:
    needs: pypi-toolchain
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shellsim
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
