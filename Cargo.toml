[package]
name = "shellsim"
version = "0.1.0"
edition = "2021"
description = "Deterministic, resource-constrained BusyBox-like environment for evaluating agents"
license = "Apache-2.0"

[[bin]]
name = "shellsim"
path = "src/main.rs"

[lib]
name = "shellsim"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
crc32fast = "1"
# 0.0.16 retains the custom ResourceTracker needed for deterministic CPU fuel.
monty = { git = "https://github.com/pydantic/monty", rev = "142807bbba3636a7525f017cea15b8d4f2bd5ed8", optional = true }

# Process-level syscall sandbox (Linux only): a startup seccomp filter that denies
# network/exec/fork so no Python-level trick can reach the real OS for those. shellsim
# itself never opens sockets, execs, or forks, so this is safe for its own file I/O.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[features]
default = []
monty = ["dep:monty"]
# Retained as an empty compatibility feature. Python is now always the minimal `-c` shim.
python = []

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
