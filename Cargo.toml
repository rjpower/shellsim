[package]
name = "shellsim"
version = "0.1.32"
edition = "2021"
description = "In-process BusyBox-like environment for RL rollouts and agent tests"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rjpower/shellsim"
# Registry publishing would drop the required runtime source overlay.
publish = false
include = [
    "/src/**",
    "/build.rs",
    "/python/native/Cargo.lock",
    "/vendor/wasmtime/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "shellsim"
path = "src/main.rs"

[[bin]]
name = "shellsim-python"
path = "src/bin/shellsim-python.rs"

[lib]
name = "shellsim"
path = "src/lib.rs"

[dependencies]
directories-next = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
toml = "0.8"
glob = "0.3"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
memchr = "2"
wasmtime = { path = "vendor/wasmtime", version = "49.0.0", default-features = false, features = ["runtime", "cranelift", "gc-drc", "std", "async", "call-hook", "threads", "cache", "parallel-compilation"] }
wasmparser = "0.258.0"
async-trait = "0.1.92"
num-bigint = "0.4"
num-traits = "0.2"
libm = "0.2"
stacker = "0.1"
unicode-normalization = "0.1"

# Process-level syscall sandbox (Linux only): a startup seccomp filter that denies
# network/exec/fork so no Python-level trick can reach the real OS for those. shellsim
# itself never opens sockets, execs, or forks, so this is safe for its own file I/O.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }
seccompiler = "0.5"
libc = "0.2"

[features]
default = []
# Retained as an empty compatibility feature. Python is now always the minimal `-c` shim.
python = []

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
wat = "1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
