[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellsim-c-toolchain"
version = "0.1.26"
description = "Pinned C-to-Wasm compiler and WASI sysroot for shellsim guests"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 AND LGPL-2.1-only AND MIT AND BSD-2-Clause AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "The shellsim authors" }]

[project.urls]
Homepage = "https://github.com/rjpower/shellsim"
Repository = "https://github.com/rjpower/shellsim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shellsim_c_toolchain = ["_assets/**/*"]
